name: Build

# Private repo: Actions minutes are limited and builds normally happen locally,
# so this only runs when started by hand from the Actions tab.
on:
  workflow_dispatch:

# A newer push to the same PR cancels the run still going for the older one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Release APKs are signed with the key stored in the repo's Actions secrets, so every
      # build has the same signature and installs over the last one.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VENTY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::VENTY_KEYSTORE_BASE64 secret is missing; see docs/SIGNING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VENTY_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build APKs
        env:
          VENTY_KEYSTORE_PASSWORD: ${{ secrets.VENTY_KEYSTORE_PASSWORD }}
          VENTY_KEY_ALIAS: ${{ secrets.VENTY_KEY_ALIAS }}
          VENTY_KEY_PASSWORD: ${{ secrets.VENTY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: venty-apk
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
